# Diagram library — progress audit.
#
# Runs scripts/diagram-library-progress.mjs against the live
# diagram_library Postgres table and posts the result in three places:
#
#   1. The workflow run's "Summary" tab — phone-friendly, instant view.
#   2. As an artifact (the .md + .json) for download or CI consumption.
#   3. As a Pull Request that updates docs/diagram-library-progress.md
#      so the repo retains a versioned history of progress over time.
#
# Trigger: tap "Run workflow" in the Actions tab (workflow_dispatch).
# An optional weekly schedule is included but commented out — uncomment
# the `schedule` block to enable a Monday-morning auto-refresh.
#
# Required repository secret:
#   DATABASE_URL — Supabase Postgres pooler connection string. Set under
#                  Settings → Secrets and variables → Actions → New
#                  repository secret. Pooler URL only (the one that
#                  starts with postgresql://...:6543/...). Never put the
#                  direct-connection URL in CI.
#
# This workflow does NOT call Manus or any image-generation API. It is
# pure read-only against your own database. It will not change any data
# in diagram_library — it only reads from it.

name: Diagram library — progress audit

on:
  workflow_dispatch:
    inputs:
      open_pr:
        description: "Open a PR with the refreshed report"
        type: boolean
        required: false
        default: true
  # Uncomment to auto-refresh every Monday at 06:00 UTC:
  # schedule:
  #   - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    name: Audit diagram catalogue progress
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Install pg only — the audit script has just one runtime dep so we
      # skip the full `npm ci` to keep the run snappy (~10s vs ~3 min).
      - name: Install Postgres client
        run: npm install pg@8 --no-save --silent

      - name: Verify DATABASE_URL secret is set
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error title=Missing secret::DATABASE_URL is not configured. See docs/diagram-library-progress-setup.md for step-by-step instructions."
            exit 1
          fi
          # Smoke-test the URL shape without echoing its value.
          if ! echo "$DATABASE_URL" | grep -qE '^postgres(ql)?://'; then
            echo "::error title=Bad secret::DATABASE_URL does not look like a Postgres connection string."
            exit 1
          fi
          echo "DATABASE_URL is set and looks well-formed."

      - name: Run progress audit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/diagram-library-progress.mjs --json

      - name: Post report to job summary
        run: |
          {
            cat docs/diagram-library-progress.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report as a downloadable artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagram-library-progress-${{ github.run_id }}
          path: |
            docs/diagram-library-progress.md
            docs/diagram-library-progress.json
          retention-days: 30
          if-no-files-found: warn

      - name: Open or update PR with the refreshed report
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.open_pr == 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(diagrams): refresh progress audit"
          title: "Diagram library — progress audit refresh"
          body: |
            Automated refresh of `docs/diagram-library-progress.md`,
            generated by `scripts/diagram-library-progress.mjs`.

            **What this PR contains:**
            - Updated `docs/diagram-library-progress.md` — the human-readable progress report.
            - Updated `docs/diagram-library-progress.json` — machine-readable snapshot for any downstream tooling.

            **What this PR does NOT change:**
            - Application code, schema, or any production data.
            - The catalogue itself (`docs/diagram-library-catalogue.csv` / `.txt`).

            Re-run anytime via Actions → "Diagram library — progress audit" → Run workflow.
          branch: chore/diagram-library-progress-audit
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: |
            diagram-library
            automated
          add-paths: |
            docs/diagram-library-progress.md
            docs/diagram-library-progress.json
