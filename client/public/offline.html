<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adaptly — Offline</title>
    <meta name="theme-color" content="#10B981" />
    <style>
      :root { color-scheme: light; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #fbfaf6;
        color: #1f2933;
      }
      .shell {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      .card {
        max-width: 32rem;
        background: #ffffff;
        border: 1px solid #e7e2d6;
        border-radius: 1rem;
        padding: 2rem 1.75rem;
        box-shadow: 0 12px 30px -20px rgba(0, 0, 0, 0.18);
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: #ecfdf5;
        color: #047857;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 0.375rem 0.75rem;
        border-radius: 999px;
      }
      h1 {
        margin: 1.25rem 0 0.5rem;
        font-size: 1.75rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0.5rem 0;
        color: #4b5563;
        line-height: 1.5;
      }
      button {
        margin-top: 1.5rem;
        background: #10b981;
        color: #ffffff;
        border: none;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        cursor: pointer;
      }
      button:hover, button:focus-visible {
        background: #059669;
        outline: none;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="card" role="status" aria-live="polite">
        <span class="badge">Offline</span>
        <h1>School WiFi looks shaky.</h1>
        <p>Adaptly is offline right now, but cached pages will keep working.</p>
        <p>Try again when you're back on a stable connection.</p>
        <button type="button" onclick="location.reload()">Try again</button>
      </section>
    </main>
  </body>
</html>
